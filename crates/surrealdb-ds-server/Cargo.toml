[package]
name = "surrealdb-ds-server"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
description = "Binary that registers the surrealdb-ds engine and serves the SurrealQL front end on it"
publish = false

[dependencies]
surrealdb-ds = { path = "../surrealdb-ds" }
surrealdb-cnf = "3.3.0"
surrealdb-kvs-any = "3.3.0"
surrealdb-server = "3.3.0"
# Needed to implement `ConfigCheck`, which surrealdb-server declares with
# #[async_trait]. Same version surrealdb-server resolves to, so one copy.
async-trait = "0.1"
# `ObservabilityProvider` (the server's) has `surrealdb_observe::ObservabilityProvider`
# as a supertrait, so satisfying it means naming the supertrait. Already in the
# graph at 3.3.0; declared here only to name it.
surrealdb-observe = "3.3.0"
anyhow = "1"
# For the `Router` type `RouterFactory::configure_router` returns. Already in the
# graph at the same version surrealdb-server uses.
axum = "0.8"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# The golden-file harness names `RawRange`, `AnyRange` and `TransactionType`,
# which live in the `Transactable` contract crate the engine already links.
surrealdb-kvs = "3.3.0"

# The RocksDB binding upstream itself uses, so `tests/interop.rs` can open a
# directory upstream wrote with *our* code rather than with theirs. This is the
# SurrealDB-maintained fork (`surrealdb-rocksdb`, wrapping RocksDB 11.0.0), not
# the public `rocksdb` crate — see ADR-0008 and PROVENANCE.md R-0050/R-0051.
#
# `default-features = false` with the feature set pinned to exactly what
# `surrealdb-kvs-rocksdb` already asks for is load-bearing, not tidiness. Cargo
# unions features per package across the whole graph, so taking this crate's
# defaults would additionally enable `zstd`, `zlib`, `bzip2` and
# `bindgen-runtime`, which changes `surrealdb-librocksdb-sys`'s own feature set
# and forces a full recompile of the bundled RocksDB C++ — several minutes of
# build for codecs this harness never asks for. Pinned to the same set, the
# already-compiled artifact is reused.
surrealdb-rocksdb = { version = "0.24.0-surreal.5", default-features = false, features = ["lz4", "snappy"] }